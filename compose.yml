services:
  spatial-database:
    image: postgis/postgis:18-master
    env_file:
      - .env.example
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d ingested_data"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data: