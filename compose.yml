services:
  router:
    image: traefik:v3.8
    command:
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always

  spatial-database:
    image: postgis/postgis:18-3.7
    env_file:
      - .env
    volumes:
      - postgis-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d ingested_data"]
      interval: 2s
      timeout: 5s
      retries: 5
    restart: always

  dashboard:
    image: grafana/grafana:13.0
    volumes:
      - grafana-storage:/var/lib/grafana 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`grafana.${SERVER_HOSTNAME}`)"
    restart: always
    depends_on:
      spatial-database:
        condition: service_healthy

  tile-server:
    image: ghcr.io/maplibre/martin:2.0.0-beta.8
    volumes:
      - ./martin/config:/config 
    command:
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-spatial-database}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.tiles.loadbalancer.server.port=3000"
      - "traefik.http.routers.tiles.rule=Host(`tiles.${SERVER_HOSTNAME}`) && !PathPrefix(`/_/metrics`)"
    restart: always
    depends_on:
      spatial-database:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully

  ingest:
    build: ./ingest
    env_file:
      - .env
    volumes:
      - ingest-cache:/ingest/data
    restart: on-failure
    depends_on:
      spatial-database:
        condition: service_healthy
    

volumes:
  postgis-data:
  grafana-storage:
  ingest-cache: