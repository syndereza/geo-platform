services:
  spatial-database:
    image: postgis/postgis:18-3.7
    env_file:
      - .env.example
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d ingested_data"]
      interval: 2s
      timeout: 5s
      retries: 5

  dashboard:
    image: grafana/grafana:13.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana 
    depends_on:
      spatial-database:
        condition: service_healthy

  tile-server:
    image: ghcr.io/maplibre/martin:2.0.0-beta.8
    ports:
      - "3001:3000"
    volumes:
      - ./martin/config:/config 
    command:
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-spatial-database}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
    depends_on:
      spatial-database:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully

  ingest:
    build: ./ingest
    env_file:
      - .env.example
    environment:
      - POSTGRES_HOST=spatial-database
      - POSTGRES_PORT=5432
    volumes:
      - ingest-cache:/ingest/data
    restart: on-failure
    depends_on:
      spatial-database:
        condition: service_healthy

volumes:
  postgis-data:
  grafana-storage:
  ingest-cache: